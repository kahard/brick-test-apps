; Pinned PlatformIO platforms and libraries shared by every application.
; Each platformio.ini pulls this file in through `extra_configs` and refers to
; the values as ${versions.<name>}. Bump versions here, in a separate commit.
[versions]
; ESP32 apps use the pioarduino fork: the official platform has no ESP32-P4
; support. Both register as `espressif32`, so never leave it unpinned.
espressif32 = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.312-1/platform-espressif32.zip
espressif8266 = platformio/espressif8266 @ 4.2.1
tft_espi = bodmer/TFT_eSPI @ 2.5.43
lvgl = lvgl/lvgl @ 9.5.0
