[platformio]
extra_configs = ../../../../platformio-versions.ini

[env:esp32s3_480_display_benchmark_demo]
platform = ${versions.espressif32}
board = esp32-s3-devkitc-1
framework = espidf
monitor_speed = 115200
upload_speed = 460800
board_build.flash_mode = qio
board_upload.flash_size = 16MB
board_build.cmake_extra_args = -DSDKCONFIG_DEFAULTS="sdkconfig.defaults"
extra_scripts = pre:extra_script.py
; Montserrat 20 is the benchmark's large font (14 is on by default).
build_flags = -Iinclude -I../../../../libs/brick/boards/include
    -DLV_CONF_SKIP=1
    -DLV_FONT_MONTSERRAT_20=1
lib_deps =
    ${versions.lvgl}
