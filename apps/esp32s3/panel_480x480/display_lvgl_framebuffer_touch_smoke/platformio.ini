[platformio]
extra_configs = ../../../../platformio-versions.ini

[env:esp32s3_480_display_lvgl_framebuffer_touch_smoke]
platform = ${versions.espressif32}
board = esp32-s3-devkitc-1
framework = espidf
monitor_speed = 115200
upload_speed = 460800
board_build.flash_mode = qio
board_upload.flash_size = 16MB
board_build.cmake_extra_args = -DSDKCONFIG_DEFAULTS="sdkconfig.defaults"
extra_scripts = pre:extra_script.py
build_flags = -Iinclude -I../../../../libs/brick/boards/include
    -DLV_CONF_SKIP=1
lib_deps =
    ${versions.lvgl}
