[platformio]
extra_configs = ../../../../platformio-versions.ini

[env:jc8012_10_network_wifi_internet_smoke]
platform = ${versions.espressif32}
board = esp32-p4-evboard
framework = espidf
monitor_speed = 115200
upload_speed = 460800
board_build.flash_mode = dio
board_build.flash_size = 16MB
board_build.psram_type = hex
board_build.cmake_extra_args = -DSDKCONFIG_DEFAULTS="sdkconfig.defaults"
build_type = debug
extra_scripts = pre:extra_script.py
