[platformio]
extra_configs = ../../../../platformio-versions.ini

[env:jc8012_10_display_benchmark_demo]
platform = ${versions.espressif32}
board = esp32-p4-evboard
framework = espidf
monitor_speed = 115200
upload_speed = 460800
board_build.flash_mode = qio
board_build.flash_size = 16MB
board_build.psram_type = hex
board_build.partitions = partitions.csv
board_build.sdkconfig_defaults = sdkconfig.defaults
extra_scripts = pre:extra_script.py
; Montserrat 20 is the benchmark's large font (14 is on by default). LVGL fills
; and copies images with the PPA (LV_USE_PPA); its draw buffer alignment must
; equal the L2 cache line (CONFIG_CACHE_L2_CACHE_LINE_SIZE).
build_flags =
    -Isrc
    -D CONFIG_IDF_EXPERIMENTAL_FEATURES=1
    -D LV_CONF_SKIP=1
    -D LV_FONT_MONTSERRAT_20=1
    -D LV_USE_PPA=1
    -D LV_USE_PPA_IMG=1
    -D LV_DRAW_BUF_ALIGN=128
    -D CONFIG_LV_DRAW_BUF_ALIGN=128
lib_deps = ${versions.lvgl}
