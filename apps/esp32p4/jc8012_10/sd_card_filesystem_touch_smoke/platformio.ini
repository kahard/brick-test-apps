[platformio]
extra_configs = ../../../../platformio-versions.ini
default_envs = jc8012_10_sd_card_filesystem_touch_smoke

[env:jc8012_10_sd_card_filesystem_touch_smoke]
platform = ${versions.espressif32}
board = esp32-p4-evboard
framework = espidf
build_flags =
    -Isrc
monitor_speed = 115200
upload_speed = 460800
board_build.flash_mode = qio
board_build.flash_size = 16MB
board_build.psram_type = hex
extra_scripts = pre:extra_script.py
