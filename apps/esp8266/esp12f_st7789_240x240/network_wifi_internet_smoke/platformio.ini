[platformio]
extra_configs = ../../../../platformio-versions.ini
default_envs = esp12f_st7789_network_wifi_internet_smoke

[env:esp12f_st7789_network_wifi_internet_smoke]
platform = ${versions.espressif8266}
board = esp12e
framework = arduino
monitor_speed = 115200
upload_speed = 921600
board_build.flash_mode = dout
board_build.f_cpu = 160000000L
lib_deps =
  ${versions.tft_espi}
  ESP8266WiFi
extra_scripts = pre:extra_script.py
build_flags =
  ; Wi-Fi code does not fit the default 32 KB of IRAM: 48 KB IRAM, 16 KB cache.
  -DPIO_FRAMEWORK_ARDUINO_MMU_CACHE16_IRAM48
  -DUSER_SETUP_LOADED=1
  -DST7789_DRIVER=1
  -DTFT_WIDTH=240
  -DTFT_HEIGHT=240
  -DTFT_MOSI=13
  -DTFT_SCLK=14
  -DTFT_CS=-1
  -DTFT_DC=0
  -DTFT_RST=2
  -DTFT_BL=5
  -DTFT_RGB_ORDER=TFT_BGR
  -DTOUCH_CS=-1
  -DTFT_BACKLIGHT_ON=LOW
  -DLOAD_GLCD=1
  -DSPI_FREQUENCY=40000000
  -DSPI_READ_FREQUENCY=10000000
  -DARDUINO_ESP8266_RELEASE_2_7_4_OR_NEWER=1
  -I$PROJECT_DIR/../../../../libs/brick/libs/interfaces/include
  -I$PROJECT_DIR/../../../../libs/brick/platforms/esp8266/include
  -I$PROJECT_DIR/../../../../libs/brick/boards/include
